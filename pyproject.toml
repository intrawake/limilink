[project]
name = "limilink"
version = "0.1.0"
description = "A web chat proxy to bridge the dreamscape persona via gemini-cli."
readme = "README.md"
license = { text = "0BSD" }
authors = [
  { name = "paprika-bot", email = "sockpaprika-git@intrawake.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "httpx2>=2.5.0",
    "sxpb @ git+https://github.com/sxproto/sxpb-py.git@539ea1b3fde70abe6c1c2f5188290e51a577d204",
    "aiofiles>=25.1.0",
]

[project.optional-dependencies]
discord = ["discord-py>=2.3.2"]
otel = [
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-instrumentation-httpx>=0.62b1",
    "opentelemetry-instrumentation-logging>=0.62b1",
]

[project.urls]
Homepage = "https://github.com/intrawake/limilink"
Repository = "https://github.com/intrawake/limilink"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff==0.15.22",
    "ty==0.0.64",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["test"]

[tool.pdm.scripts]
limilink = { shell = "PYTHONPATH=src python src/server.py" }
preset_server = { shell = "PYTHONPATH=src python src/server.py --config preset/config.sxpb" }
limilink-discord = { shell = "PYTHONPATH=src python demo/discord_bot.py" }
preset_discord_bot = { shell = "LIMILINK_CONFIG=preset/config.sxpb PYTHONPATH=src python demo/discord_bot.py" }
test = "pytest -q"
check-format = "ruff check"
check-type = "ty check"
lint-sxpb = "sxpb-lint --ignore-file .gitignore"
tidy-python = "ruff format"
tidy-sxpb = "sxpb-tidy --ignore-file .gitignore"
tidy = {composite = ["tidy-python", "tidy-sxpb"]}
lint = {composite = ["check-format", "check-type", "lint-sxpb"]}
tidytest = {composite = ["tidy", "lint", "test"]}

[tool.ty.environment]
root = ["src", "test", "."]
